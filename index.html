<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <section>

        <div class="container">
            <h1 class="calc">
                Calc It Up
            </h1>
            <div class="child">
                <input type="text" id="result" />
                <div class="buttons">

                    <button id="c">C</button>
                    <button id="del">Del</button>
                    <button>%</button>
                    <button>/</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>*</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                    <button>.</button>
                    <button>0</button>
                    <button id="equals">=</button>
                </div>
            </div>
        </div>

    </section>
</body>
<script type="module" src="script.js"></script>

</html>
